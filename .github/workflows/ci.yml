name: CI
on:
  push:
    branches: [main, optimize]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: avr-core (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: rustup override set ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (P3 baseline)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p avr-core -p avr-mcp -p avr-cli --all-targets -- -D warnings
      - run: cargo test -p avr-core -p avr-cli
      - name: avr-mcp tests (ffmpeg baseline must run)
        env:
          AVR_REQUIRE_FFMPEG: "1"
        run: cargo test -p avr-mcp -- --nocapture
      - name: Token stats (o200k_base, reference only)
        if: matrix.toolchain == 'stable'
        run: cargo test -p avr-mcp --test baseline -- --ignored --nocapture

  desktop:
    name: desktop (Windows clippy / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Build frontend (tauri frontendDist)
        working-directory: desktop/ui
        run: npm ci && npm run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
